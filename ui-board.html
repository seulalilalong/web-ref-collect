<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI 맞춤 고르는 판</title>
<style>
:root{--bg:#f3ede2;--paper:#fbf8f2;--ink:#2b2622;--mute:#7a6f63;--line:#e2d8c8;--accent:#b5562f;--accent-ink:#fff;--nope:#6b6b6b;--like:#c2413a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--paper:#26221e;--ink:#efe7db;--mute:#a89c8d;--line:#3a332c;--accent:#e08a5f;--accent-ink:#1d1a17;--nope:#8d8d8d;--like:#ec6b62}}
:root[data-theme="dark"]{--bg:#1d1a17;--paper:#26221e;--ink:#efe7db;--mute:#a89c8d;--line:#3a332c;--accent:#e08a5f;--accent-ink:#1d1a17;--nope:#8d8d8d;--like:#ec6b62}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:0 16px 96px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto}
.top{padding:36px 0 12px}
.top small{color:var(--mute);letter-spacing:.06em}
.top h1{font:600 30px/1.25 "Nanum Myeongjo","AppleMyungjo","Batang",serif;margin:6px 0 10px}
.top p{margin:4px 0;color:var(--mute);max-width:820px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin:12px 0 0;font-size:13px;color:var(--mute)}
.legend b{color:var(--ink)}
.gyeol{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:14px 0 0;max-width:900px}
.gyeol h2{margin:0 0 4px;font-size:14px;color:var(--mute);letter-spacing:.04em}
.gyeol ul{margin:0;padding-left:18px}
.gyeol .avoid{color:var(--mute);margin-top:6px}
.notice{background:var(--paper);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:14px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:12px 0;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:14px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.n{font-weight:400;opacity:.7;margin-left:4px}
.panel{display:none;padding-top:16px}.panel.on{display:block}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.jump a{text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.jump a:hover{border-color:var(--accent)}
.group{margin:26px 0 40px;scroll-margin-top:70px}
.group header{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.gk{flex:none;min-width:44px;height:44px;padding:0 8px;border-radius:22px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.group h2{margin:0;font:600 21px/1.3 "Nanum Myeongjo","AppleMyungjo","Batang",serif}
.group header p{margin:2px 0 0;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:opacity .2s,border-color .2s}
.card.has{border:2px solid var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.card.is-nope{opacity:.45;border-style:dashed}.card.is-nope img{filter:grayscale(1)}
.card.was-nope:not(.has){opacity:.6}
.shot{display:block;aspect-ratio:3/4;overflow:hidden;background:var(--line)}
.shot.wide{aspect-ratio:16/10}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.shot.txt{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:16px;color:var(--ink);text-decoration:none;font-size:14px;aspect-ratio:auto;min-height:110px}
.shot.txt span{color:var(--mute);font-size:12.5px}
.card.broken .shot img{display:none}
.card.broken .shot::after{content:"그림이 안 떠요 — 눌러서 원본을 열어 보세요";display:block;padding:16px;color:var(--mute);font-size:13px}
.code{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px}
.card.has .code{background:var(--accent);color:var(--accent-ink)}
.badge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.first{background:var(--like);color:#fff}
.badge.first.no{background:var(--nope)}
.meta{padding:10px 12px 12px}
.q{margin:0 0 6px;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.chips .chip:last-child:nth-child(odd){grid-column:1/-1}
.chip{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 4px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.nope{width:100%;margin-top:5px;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:5px 4px;font-size:12.5px;color:var(--mute)}
.nope[aria-pressed="true"]{background:var(--nope);border-color:var(--nope);border-style:solid;color:#fff}
.memo{display:none;width:100%;margin-top:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px}
.card.has .memo,.card.is-nope .memo{display:block}
.sum h2{font:600 20px/1.3 "Nanum Myeongjo","AppleMyungjo","Batang",serif;margin:26px 0 8px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumbs figure{margin:0;width:120px}
.thumbs img{width:120px;height:150px;object-fit:cover;object-position:top;border-radius:6px;display:block;border:1px solid var(--line);background:var(--line)}
.thumbs figure.w{width:180px}.thumbs figure.w img{width:180px;height:112px}
.thumbs .noimg{width:120px;height:150px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--mute);text-align:center;padding:6px}
.thumbs figcaption{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.35}
.thumbs figcaption b{color:var(--ink)}
.none{color:var(--mute);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:10px 16px}
.bar .cnt{margin-right:auto;font-size:14px}
.bar .hint{font-size:12.5px;opacity:.8}
.bar button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:8px 16px;font-weight:600}
.bar button.ghost{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.copybox{position:fixed;left:16px;right:16px;bottom:64px;z-index:7;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:none;box-shadow:0 6px 30px rgba(0,0,0,.18)}
.copybox.on{display:block}
.copybox p{margin:0 0 6px;font-size:14px}
.copybox textarea{width:100%;height:160px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.copybox button{margin-top:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px}
.err{background:var(--paper);border:2px solid var(--like);border-radius:10px;padding:16px;margin:40px 0}
.guide{max-width:1040px}
.guide h2{font:600 24px/1.3 "Nanum Myeongjo","AppleMyungjo","Batang",serif;margin:8px 0 6px}
.guide h3{font:600 19px/1.3 "Nanum Myeongjo","AppleMyungjo","Batang",serif;margin:30px 0 8px}
.guide p{margin:6px 0;max-width:820px}
.wf{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;max-width:820px}
.wf .nav{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.wf .nav b{font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif;font-size:15px;margin-right:auto}
.wf .btn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 12px;font-weight:600}
.wf .hero{margin:10px 0;height:120px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--line) 0 10px,transparent 10px 20px);display:grid;place-items:center;color:var(--mute);font-size:13px}
.wf .band{position:relative;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,var(--bg));padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wf .cd{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;min-height:86px}
.wf .ic{display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;font-size:13px;margin-bottom:6px}
.wf .tape{position:absolute;top:-8px;left:30%;width:46px;height:16px;background:color-mix(in srgb,var(--like) 35%,transparent);transform:rotate(-6deg)}
.wf .num{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--like);color:#fff;font:700 12px/22px sans-serif;text-align:center;z-index:2}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:0;list-style:none;max-width:1040px}
.parts li{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.parts li b{display:block}
.guide table{border-collapse:collapse;width:100%;max-width:1040px;font-size:14px}
.guide th,.guide td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.guide th{color:var(--mute);font-weight:600}
.guide .go{display:inline-block;margin:18px 0;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;text-decoration:none;font-weight:600}
@media (max-width:560px){.wf .band{grid-template-columns:1fr}.wf .nav span.m{display:none}}
@media (max-width:560px){.top h1{font-size:24px}.grid{grid-template-columns:1fr 1fr;gap:10px}.meta{padding:8px}.chip,.nope{font-size:11.5px}.q{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* 「먼저 · 보는 법」 탭 — 고치지 않아도 된다. {name}은 BOARD.name으로 바뀐다 */
window.GUIDE_HTML = '<div class="guide">'+
'<h2>UI가 뭐예요?</h2>'+
'<p>UI(유아이)는 화면의 <b>부품</b>이에요. 메뉴, 버튼, 정보를 담는 카드와 칸, 아이콘처럼 방문자가 보고 누르는 것들이에요.</p>'+
'<p>앞 단계(사이트 레퍼런스)에서는 「어떤 분위기의 사이트인가」를 골랐어요. 이번에는 「그 분위기를 <b>어떤 부품으로</b> 만들까」를 골라요. 집에 비유하면 사이트는 「어떤 집에 살고 싶은가」, UI는 「문고리·창틀·선반·스위치를 어떤 걸로 할까」예요.</p>'+
'<h3>화면 한 장에서 UI 찾기</h3>'+
'<p>아래는 {name} 사이트를 대충 그려 본 뼈대예요. 번호가 붙은 곳이 모두 UI예요.</p>'+
'<div class="wf" aria-hidden="true">'+
'<div class="nav"><b>{name}</b><span class="m">소개</span><span class="m">하는 일</span><span class="m">소식</span><span class="btn">신청하기</span></div>'+
'<span class="num" style="top:6px;left:44%">1</span><span class="num" style="top:6px;right:6px">2</span>'+
'<div class="hero">첫 화면 — 앞 단계에서 골랐어요</div>'+
'<div class="band"><span class="num" style="top:-10px;left:-8px">4</span>'+
'<div class="cd"><span class="tape"></span><span class="num" style="top:-10px;right:-8px">6</span><span class="ic">✿</span><br>하는 일 하나</div>'+
'<div class="cd"><span class="num" style="top:-10px;right:-8px">3</span><span class="ic">☕</span><br>하는 일 둘</div>'+
'<div class="cd"><span class="num" style="top:20px;left:-8px">5</span><span class="ic">✉</span><br>하는 일 셋</div>'+

'<li><b>② 버튼</b>「신청하기」처럼 누르는 것. 둥근지 각졌는지, 꽉 찼는지 테두리만인지.</li>'+
'<li><b>③ 카드</b>정보 한 장을 담는 상자. 수업 하나, 상품 하나, 후기 하나.</li>'+

'<li><b>⑤ 아이콘</b>메뉴·카드 옆의 작은 그림. 가는 선? 꽉 찬 면? 손그림?</li>'+
'<li><b>⑥ 장식</b>테이프·우표·스티커 같은 꾸밈. 사이트에서 그런 결을 고른 분에게만 모았어요.</li>'+
'</ol>'+
'<p><b>이번에 고르지 않는 것</b> — 첫 화면은 앞 단계에서 이미 골랐고, 움직임은 그림으로 볼 수 없어서 나중에 실제로 움직이는 견본을 보며 골라요.</p>'+

'<p>카드 아래 칸은 위의 부품과 같아요. 카드 하나에서 한 부분만 좋아도 그 칸만 누르면 돼요.</p>'+

'<tr><td><b>칸</b></td><td>④ 페이지를 나누는 구역</td><td>구역이 바뀔 때 무엇으로 나누나? 바탕색, 선, 물결, 찢은 종이?</td></tr>'+
'<tr><td><b>아이콘</b></td><td>⑤ 작은 그림</td><td>가는 선인가 꽉 찬 면인가? 손그림인가?</td></tr>'+
'<tr><td><b>장식</b></td><td>⑥ 테이프·우표·스티커</td><td>사진·카드에 붙여도 어지럽지 않을까?</td></tr></table>'+
'<h3>헷갈릴 때</h3><ul>'+
'<li><b>예쁜데 우리랑 안 맞으면?</b> 부품 하나만 빌려도 돼요. 버튼 모양만 좋으면 「버튼」만 누르고 메모에 「버튼 모양만」.</li>'+
'<li><b>무엇이 UI인지 모르겠으면?</b> 「누를 수 있는 것」과 「글·사진을 담은 상자」를 찾아보세요. 그게 거의 다 UI예요.</li>'+
'<li><b>그림만 있고 사이트가 아니면?</b> 아이콘·장식으로 쓸 수 있어요. 그 칸을 누르고 메모를 남겨 주세요.</li>'+
'<li><b>메모는 짧게</b> — 「이 칸 모양」, 「버튼 둥근 것」처럼 부분 이름 하나면 충분해요.</li></ul>'+
'<a href="#" class="go" data-go="main">준비됐으면 「맞춤 판」으로 →</a>'+
'</div>';

var LAB={};TAGS.forEach(function(t){LAB[t[0]]=t[1]});
var KEY='wrc:'+(B.id||'board'),S={},canSave=true;
try{localStorage.setItem(KEY+':t','1');localStorage.removeItem(KEY+':t');S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){canSave=false}
function save(){if(!canSave)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canSave=false;warn()}}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function imgOf(v){if(!v)return'';v=String(v);if(/^https?:/.test(v))return v;var p=v.split('.'),h=p[0],x=p.length>1?'.'+p[1]:'.jpg';return'https://i.pinimg.com/736x/'+h.slice(0,2)+'/'+h.slice(2,4)+'/'+h.slice(4,6)+'/'+h+x}
function pinUrl(p){return p?'https://www.pinterest.com/pin/'+p+'/':''}
function isWeb(q){return/website|web ?design|landing ?page|web ?ui|ui ?design|ui ?kit|웹/i.test(q||'')}
function hashOf(v){var m=String(v||'').match(/[0-9a-f]{32}/);return m?m[0]:''}
/* 카드 목록 — 같은 그림은 한 번만(맨 앞 묶음이 먼저) */
var cards=[],seen={},pre=UI?'U':'';
(B.picks||[]).forEach(function(p,i){var code=p.code||('첫'+(i+1));if(p.pin)seen[p.pin]=1;var h=hashOf(p.img);if(h)seen[h]=1;
  var im=imgOf(p.img);cards.push({id:'pick:'+code,g:'_picks',code:code,pick:1,img:im,wide:!!im&&!/pinimg\.com/.test(im),pin:p.pin||'',link:p.pin?pinUrl(p.pin):(p.link||''),q:p.q||'',title:p.title||'',line:p.line||'',tags:p.tags||'',from:p.from||'첫 판',was:p.v||'like',memo0:p.memo||''})});
B.groups.forEach(function(g){var n=0;(g.rows||[]).forEach(function(r){String(r.c||'').trim().split(/\s+/).forEach(function(tok){if(!tok)return;var k=tok.split(':'),pin=k[0],hv=k[1]||'',h=hv.split('.')[0];if(!pin||!h||seen[pin]||seen[h])return;seen[pin]=seen[h]=1;n++;
  cards.push({id:pin,g:g.key,code:pre+g.key+(n<10?'0':'')+n,img:imgOf(hv),pin:pin,link:pinUrl(pin),q:r.q||''})})});g._n=n});
var byId={};cards.forEach(function(c){byId[c.id]=c});
function st(id){return S[id]||(S[id]={tags:[],nope:false,memo:''})}
function get(id){var s=S[id];return s&&s.tags?s:{tags:[],nope:false,memo:''}}
/* 그리기 */
function cardHtml(c){var shot;
  if(c.img)shot='<a class="shot'+(c.wide?' wide':'')+'" href="'+esc(c.link||c.img)+'" target="_blank" rel="noopener" title="'+(c.pin?'핀 열기':'사이트 열기')+'"><img loading="lazy" src="'+esc(c.img)+'" alt=""></a>';
  else shot='<a class="shot txt" href="'+esc(c.link)+'" target="_blank" rel="noopener"><b>'+esc(c.title||c.code)+'</b><span>그림은 첫 판에서 보세요 · 누르면 사이트가 열려요</span></a>';
  var badge=c.pick?'<span class="badge first'+(c.was==='nope'?' no':'')+'">'+esc(c.from)+(c.was==='nope'?' ✕':' ♥')+'</span>':(isWeb(c.q)?'<span class="badge">웹사이트</span>':'');
  var q=c.pick?[c.title&&c.img?c.title:'',c.tags?'첫 판 칸: '+c.tags:'',c.line,c.memo0?'메모: '+c.memo0:''].filter(Boolean).join(' · '):(c.q?'검색어 「'+c.q+'」':'');
  return '<article class="card'+(c.pick&&c.was==='nope'?' was-nope':'')+'" data-id="'+esc(c.id)+'">'+shot+'<span class="code">'+esc(c.code)+'</span>'+badge+
  '<div class="meta">'+(q?'<p class="q">'+esc(q)+'</p>':'')+'<div class="chips">'+TAGS.map(function(t){return'<button type="button" class="chip" data-tag="'+t[0]+'" aria-pressed="false">'+t[1]+'</button>'}).join('')+'</div>'+
  '<button type="button" class="nope" aria-pressed="false">✕ 이건 싫다</button><input class="memo" type="text" placeholder="무엇이 좋은지 / 싫은지 한 줄" aria-label="'+esc(c.code)+' 메모"></div></article>'}
var groups=[];if((B.picks||[]).length)groups.push({key:'_picks',label:'첫 판',name:B.picksName||'첫 판에서 고른 카드',desc:B.picksDesc||'고르신 그대로 맨 앞에 두었어요. 여기서도 칸을 다시 골라 주세요.'});
B.groups.forEach(function(g){if(g._n)groups.push({key:g.key,label:pre+g.key,name:g.name,desc:g.desc||''})});
var h='<header class="top"><small>'+esc(B.course||'AI 브랜드 웹사이트 4주 과정')+' · '+esc(B.name)+' · '+(UI?'UI 맞춤 판':'사이트 맞춤 판')+'</small>'+
  '<h1>'+(UI?'화면의 부품과 결을 고르세요':'마음에 닿는 사이트를 고르세요')+'</h1>'+
  '<p>첫 판에서 고르신 카드와 브리프로 핀터레스트를 한 번 더 모았어요. 카드마다 <b>쓰임새 칸</b>을 눌러 주세요. 한 카드에 여러 칸을 눌러도 되고, 마음에 안 들면 <b>✕ 이건 싫다</b>. 그림을 누르면 원본(핀터레스트 핀 · 웹사이트 카드는 그 사이트)이 열려요.</p>'+
  '<p>고른 것은 <b>이 컴퓨터의 이 브라우저에만</b> 남아요. 다 고르면 아래 「골라 둔 것 복사」를 눌러 Claude에게 붙여 넣어 주세요.</p>'+
  '<div class="legend">'+(UI?'<span><b>전체 UI 결</b> 부품 전체의 말투</span><span><b>메뉴</b> 맨 위 길잡이</span><span><b>버튼</b> 누르는 것</span><span><b>카드</b> 정보 한 장을 담는 상자</span><span><b>칸</b> 페이지를 나누는 구역과 그 경계</span><span><b>아이콘</b> 작은 그림</span><span><b>장식</b> 테이프·우표 같은 꾸밈</span>':'<span><b>전체 무드</b> 사이트 전체 분위기</span><span><b>첫 화면</b> 들어오자마자 보이는 화면</span><span><b>넣고 싶은 요소</b> 글꼴·사진틀·재질 같은 부분</span>')+'</div>';
if((B.common||[]).length||(B.avoid||[]).length)h+='<div class="gyeol"><h2>이 판을 모은 결</h2><ul>'+(B.common||[]).map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>'+((B.avoid||[]).length?'<p class="avoid">피한 결 · '+(B.avoid||[]).map(esc).join(' · ')+'</p>':'')+'</div>';
if(!canSave)h+='<p class="notice">이 브라우저에서는 고른 것이 저장되지 않아요. 다 고른 뒤 창을 닫기 전에 꼭 「골라 둔 것 복사」를 눌러 주세요.</p>';
h+='</header><nav class="tabs" role="tablist">'+(UI&&window.GUIDE_HTML?'<button type="button" role="tab" data-p="guide">먼저 · 보는 법</button>':'')+'<button type="button" role="tab" data-p="main">맞춤 판<span class="n" id="nmain"></span></button><button type="button" role="tab" data-p="sum">최종 정리</button></nav>';
if(UI&&window.GUIDE_HTML)h+='<section class="panel" id="p-guide">'+window.GUIDE_HTML.replace(/\{name\}/g,esc(B.name))+'</section>';
h+='<section class="panel" id="p-main"><nav class="jump" aria-label="묶음 바로 가기">'+groups.map(function(g){var n=cards.filter(function(c){return c.g===g.key}).length;return'<a href="#g-'+esc(g.key)+'">'+(g.key==='_picks'?'':esc(g.label)+' · ')+esc(g.name)+' <span class="n">'+n+'</span></a>'}).join('')+'</nav>';
groups.forEach(function(g){h+='<section class="group" id="g-'+esc(g.key)+'"><header><span class="gk">'+esc(g.label)+'</span><div><h2>'+esc(g.name)+'</h2><p>'+esc(g.desc)+'</p></div></header><div class="grid">'+cards.filter(function(c){return c.g===g.key}).map(cardHtml).join('')+'</div></section>'});
h+='</section><section class="panel sum" id="p-sum"><div id="sum"></div></section>';
app.innerHTML=h;
var bar=document.createElement('div');bar.className='bar';bar.innerHTML='<span class="cnt" id="cnt"></span><span class="hint" id="hint"></span><button type="button" id="copy">골라 둔 것 복사</button><button type="button" class="ghost" id="clear">전부 비우기</button>';document.body.appendChild(bar);
window.__ok=1;
function paint(el){var s=get(el.dataset.id);
  el.querySelectorAll('.chip').forEach(function(b){b.setAttribute('aria-pressed',s.tags.indexOf(b.dataset.tag)>=0)});
  el.querySelector('.nope').setAttribute('aria-pressed',!!s.nope);el.classList.toggle('has',s.tags.length>0);el.classList.toggle('is-nope',!!s.nope);
  var m=el.querySelector('.memo');if(document.activeElement!==m)m.value=s.memo||''}
function counts(){var p=0,n=0,need=[];cards.forEach(function(c){var s=get(c.id);if(s.tags.length)p++;if(s.nope)n++});
  document.getElementById('cnt').innerHTML='고른 카드 <b>'+p+'</b> · 싫다 <b>'+n+'</b>';document.getElementById('nmain').textContent=p?'· '+p:'';
  if(!UI){if(!cards.some(function(c){return get(c.id).tags.indexOf('hero')>=0}))need.push('「첫 화면」');if(!n)need.push('「이건 싫다」')}
  document.getElementById('hint').textContent=need.length?need.join(' · ')+' 칸에 하나 이상 골라 주세요':''}
function used(fn){return cards.filter(function(c){return fn(get(c.id))})}
function fig(c){var s=get(c.id);return'<figure'+(c.wide?' class="w"':'')+'>'+(c.img?'<img loading="lazy" src="'+esc(c.img)+'" alt="">':'<div class="noimg">'+esc(c.title||c.code)+'</div>')+'<figcaption><b>'+esc(c.code)+'</b>'+(s.memo?' '+esc(s.memo):'')+'</figcaption></figure>'}
function summary(){var h='';TAGS.forEach(function(t){var l=used(function(s){return s.tags.indexOf(t[0])>=0});h+='<h2>'+t[1]+'</h2>'+(l.length?'<div class="thumbs">'+l.map(fig).join('')+'</div>':'<p class="none">아직 없음</p>')});
  var no=used(function(s){return s.nope});h+='<h2>✕ 이건 싫다</h2>'+(no.length?'<div class="thumbs">'+no.map(fig).join('')+'</div>':'<p class="none">아직 없음</p>');document.getElementById('sum').innerHTML=h}
function text(){var L=['['+(UI?'UI':'사이트')+' 맞춤 판에서 고른 것] '+B.name+(B.made?' · '+B.made:'')];
  TAGS.forEach(function(t){var l=used(function(s){return s.tags.indexOf(t[0])>=0});L.push(t[1]+': '+(l.map(function(c){var m=get(c.id).memo;return c.code+(m?'('+m+')':'')}).join(', ')||'없음'))});
  var no=used(function(s){return s.nope});L.push('이건 싫다: '+(no.map(function(c){var m=get(c.id).memo;return c.code+(m?'('+m+')':'')}).join(', ')||'없음'));
  var u=used(function(s){return s.tags.length||s.nope});
  if(u.length){L.push('','카드 자세히:');u.forEach(function(c){var s=get(c.id);L.push('- '+c.code+' · '+(s.nope?'✕ 이건 싫다':s.tags.map(function(t){return LAB[t]}).join(', '))+(s.memo?' — '+s.memo:'')+(c.pick?' · '+c.from+'에서 고른 카드':'')+(c.q?' · 검색어 「'+c.q+'」':'')+(c.link?(c.pin?' · 핀 ':' · 주소 ')+c.link:'')+(c.img?' · 그림 '+c.img:''))})}
  var pk=cards.filter(function(c){return c.pick});if(pk.length)L.push('','맨 앞 묶음(첫 판에서 고른 카드): '+pk.map(function(c){return c.code}).join(', '));
  return L.join('\n')}
function sync(id){var el=app.querySelector('.card[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');if(el)paint(el);counts();summary()}
app.addEventListener('click',function(e){var b=e.target.closest('.chip,.nope');if(!b)return;var el=b.closest('.card'),id=el.dataset.id,s=st(id);
  if(b.classList.contains('chip')){var t=b.dataset.tag,i=s.tags.indexOf(t);if(i>=0)s.tags.splice(i,1);else s.tags.push(t);if(s.tags.length)s.nope=false}else{s.nope=!s.nope;if(s.nope)s.tags=[]}
  save();sync(id)});
app.addEventListener('input',function(e){if(!e.target.classList.contains('memo'))return;var id=e.target.closest('.card').dataset.id;st(id).memo=e.target.value;save();summary()});
app.querySelectorAll('.card img').forEach(function(im){im.addEventListener('error',function(){im.closest('.card').classList.add('broken')})});
var tabs=[].slice.call(app.querySelectorAll('.tabs button'));
function show(p){if(!document.getElementById('p-'+p))p='main';tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.p===p)});app.querySelectorAll('.panel').forEach(function(x){x.classList.toggle('on',x.id==='p-'+p)});try{localStorage.setItem(KEY+':tab',p)}catch(e){}}
tabs.forEach(function(t){t.addEventListener('click',function(){show(t.dataset.p);window.scrollTo({top:0})})});
var t0=UI&&window.GUIDE_HTML?'guide':'main';try{t0=localStorage.getItem(KEY+':tab')||t0}catch(e){}show(t0);
app.addEventListener('click',function(e){var a=e.target.closest('[data-go]');if(a){e.preventDefault();show(a.dataset.go);window.scrollTo({top:0})}});
var box=document.getElementById('copybox'),ta=document.getElementById('copytext');
document.getElementById('copyclose').addEventListener('click',function(){box.classList.remove('on')});
document.getElementById('copy').addEventListener('click',function(e){var b=e.currentTarget,t=text();
  function done(){b.textContent='복사됨';setTimeout(function(){b.textContent='골라 둔 것 복사'},1500)}
  function fall(){ta.value=t;box.classList.add('on');ta.focus();ta.select();try{if(document.execCommand('copy'))done()}catch(x){}}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fall);else fall()});
var armed=0;document.getElementById('clear').addEventListener('click',function(e){var b=e.currentTarget;if(!armed){armed=setTimeout(function(){armed=0;b.textContent='전부 비우기'},2500);b.textContent='한 번 더 누르면 비워요';return}
  clearTimeout(armed);armed=0;S={};save();app.querySelectorAll('.card').forEach(paint);counts();summary();b.textContent='전부 비우기'});
function warn(){var a=document.querySelector('.top');if(a&&!document.querySelector('.notice')){var p=document.createElement('p');p.className='notice';p.textContent='이 브라우저에서는 고른 것이 저장되지 않아요. 창을 닫기 전에 꼭 「골라 둔 것 복사」를 눌러 주세요.';a.appendChild(p)}}
app.querySelectorAll('.card').forEach(paint);counts();summary();
})();
</script></body></html>
